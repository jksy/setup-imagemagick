name: Secret scan

on:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Check out the PR head rather than the merge commit, so the scanned
      # range is exactly the commits the PR adds.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: .github/tools/gitleaks/go.sum
      # gitleaks releases carry no build provenance, so it is built from
      # source: the version is pinned in go.mod (bumped by Renovate) and
      # the module contents are verified against go.sum and sum.golang.org.
      - name: Build gitleaks
        working-directory: .github/tools/gitleaks
        run: |
          version=$(go list -m -f '{{.Version}}' github.com/zricethezav/gitleaks/v8)
          go build -trimpath -ldflags "-X=github.com/zricethezav/gitleaks/v8/version.Version=$version" \
            -o "$RUNNER_TEMP/gitleaks" github.com/zricethezav/gitleaks/v8
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan the PR commits
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          gitleaks version
          gitleaks git --log-opts="origin/$BASE_REF..HEAD" --redact --verbose .
