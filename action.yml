name: "setup-imagemagick"
description: "Install prebuilt ImageMagick with the installer of jksy/imagemagick-build"
author: "jksy"

inputs:
  version:
    description: "ImageMagick build version"
    required: true
  install-prefix:
    description: "Install destination prefix"
    required: false
    default: "${{ runner.temp }}/imagemagick"
  add-to-path:
    description: "Add <prefix>/bin to PATH"
    required: false
    default: "true"
  export-env:
    description: "Export PKG_CONFIG_PATH and LD_LIBRARY_PATH"
    required: false
    default: "true"
  github-token:
    description: "GitHub token used for the GitHub API calls of the installer (raises the rate limit)"
    required: false
    default: "${{ github.token }}"
  verify-attestation:
    description: "Verify the build provenance attestation of the release asset before installing it (requires gh)"
    required: false
    default: "true"
  fail-if-missing:
    description: "Deprecated and ignored: a missing release asset always fails"
    required: false
    default: ""

outputs:
  prefix:
    description: "Installation prefix"
    value: "${{ steps.install.outputs.prefix }}"
  bin-dir:
    description: "Binary directory"
    value: "${{ steps.install.outputs.bin-dir }}"
  lib-dir:
    description: "Library directory"
    value: "${{ steps.install.outputs.lib-dir }}"
  pkg-config-path:
    description: "pkg-config directory"
    value: "${{ steps.install.outputs.pkg-config-path }}"
  magick-path:
    description: "Path to magick executable"
    value: "${{ steps.install.outputs.magick-path }}"
  attestation-verified:
    description: "Whether the build provenance attestation was verified (true / false)"
    value: "${{ steps.install.outputs.attestation-verified }}"

runs:
  using: "composite"
  steps:
    - id: install
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_INSTALL_PREFIX: ${{ inputs.install-prefix }}
        INPUT_ADD_TO_PATH: ${{ inputs.add-to-path }}
        INPUT_EXPORT_ENV: ${{ inputs.export-env }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_VERIFY_ATTESTATION: ${{ inputs.verify-attestation }}
        INPUT_FAIL_IF_MISSING: ${{ inputs.fail-if-missing }}
      run: |
        "$GITHUB_ACTION_PATH/install.sh"
